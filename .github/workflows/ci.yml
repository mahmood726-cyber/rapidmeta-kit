name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # several tests (paper-figures, paper-studio, r-parity) shell out to node.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  engine-integrity:
    name: engine integrity (single-source gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 1) the canonical engine must carry every shipped correctness fix
      - name: engine-drift self-check
        run: python scripts/check_engine_drift.py --self-check
      # 2) every inline <script> in the canonical engine + deployed copy must parse
      - name: inline-JS syntax (node --check)
        run: |
          python - <<'PY'
          import re, subprocess, tempfile, os, sys
          bad = 0
          for fn in ("template/base_dupilumab_copd.html", "docs/index.html"):
              html = open(fn, encoding="utf-8").read()
              for s in re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S):
                  st = s.strip()
                  if not st or (st.startswith("{") and '"@context"' in st):
                      continue
                  with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as f:
                      f.write(s); p = f.name
                  r = subprocess.run(["node", "--check", p], capture_output=True, text=True)
                  os.unlink(p)
                  if r.returncode:
                      bad += 1; print("SYNTAX FAIL", fn, (r.stderr.splitlines() or [""])[0])
          print("inline-JS syntax failures:", bad)
          sys.exit(1 if bad else 0)
          PY
      # 3) R-parity harness must reproduce the metafor anchors (also covered by pytest)
      - name: R-parity harness
        run: node tests/r_parity_harness.cjs

  smoke-build:
    name: smoke build example dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: build the finerenone example (zero deps, deterministic)
        run: python clone.py configs/example_finerenone_ckd.json --out /tmp/demo/index.html
      - name: assert output is the full engine + offline assets
        run: |
          test -f /tmp/demo/index.html
          test -f /tmp/demo/assets/plotly.min.js
          python - <<'PY'
          import pathlib
          html = pathlib.Path("/tmp/demo/index.html").read_text(encoding="utf-8")
          assert len(html) > 500_000, len(html)
          assert "rapid_meta_finerenone_ckd" in html
          assert "rapid_meta_dupilumab_copd" not in html
          print("smoke build OK", len(html), "bytes")
          PY

  native-r-pairwise-oracle:
    name: native R 4.4.3 pairwise oracle (RR/OR, PM/DL)
    runs-on: ubuntu-24.04
    steps:
      # Pinned action revisions: no mutable @vN tags in the oracle job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.19.5"
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: "4.4.3"
      - name: Fail-closed independent base-R oracle
        run: |
          python --version
          node --version
          Rscript --version
          python -m unittest discover -s oracle-tests -p 'test_*.py' -v

  native-metafor-parity:
    name: external metafor 4.8-0 oracle (DL/PM; RR/OR; HKSJ floor)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.19.5"
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: "4.4.3"
      - name: Install exact metafor 4.8-0 source; reject unavailable package
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'install.packages(c("metadat", "numDeriv", "mathjaxr", "pbapply", "digest"), repos="https://cloud.r-project.org")'
          curl --fail --location --show-error --silent --retry 2 \
            "https://cran.r-project.org/src/contrib/metafor_4.8-0.tar.gz" \
            --output /tmp/metafor_4.8-0.tar.gz || \
          curl --fail --location --show-error --silent --retry 2 \
            "https://cran.r-project.org/src/contrib/Archive/metafor/metafor_4.8-0.tar.gz" \
            --output /tmp/metafor_4.8-0.tar.gz
          echo "59003bece34b2ed39f29dce61ca5a68287be07ec683f2f6c51f17bb50ca87801  /tmp/metafor_4.8-0.tar.gz" | sha256sum --check -
          R CMD INSTALL /tmp/metafor_4.8-0.tar.gz
          Rscript -e 'stopifnot(as.character(getRversion())=="4.4.3", packageDescription("metafor",fields="Version")=="4.8-0")'
      - name: Live external method-matched R parity (no cached anchors)
        run: |
          python --version
          node --version
          Rscript --version
          python -m unittest discover -s metafor-tests -p 'test_metafor_oracle.py' -v
